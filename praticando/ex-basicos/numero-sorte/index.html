<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número da Sorte</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual seu nome?')
        var num = Math.floor(Math.random() * (100 - 1 + 1 )) + 1 // Gera números aleatórios de 1 a 100
        window.alert(`${nome}, seu número da sorte é: ${num} 🍀`)

        // Math.floor(Math.random() * (max - min + 1)) + min
        // Essa é a fórmula.
    </script>
</body>
</html>
