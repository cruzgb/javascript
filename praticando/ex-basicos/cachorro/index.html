<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachorro</title>
</head>
<body>
    <script>
        var idade = Number(window.prompt('Digite a idade do cachorro:'))
        var idadeM = idade * 7 // Unidade de multiplicação em JS '*'
        window.alert(`Seu cachorro tem ${idadeM} anos em idade canina! 🐶`)
    </script>
</body>
</html>
