<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naturalidade</title>
</head>
<body>
    <h1>Onde você mora?</h1>
    País: <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Verificar" onclick="verify()">
    <div id="res"></div>

    <script>
        function verify(){
            var pais = document.querySelector('input#txtpais')
            var res = document.querySelector('div#res')

            res.innerHTML = `<p>Você vive em ${pais.value}</p>`

            if(pais.value == 'Brasil'){
                res.innerHTML += '<p>Você é <strong>brasileiro</strong>!</p>'
            }else{
                res.innerHTML += '<p>Você é <strong>estrangeiro</strong>!</p>'
            }
        }
    </script>
</body>
</html>
