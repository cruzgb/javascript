<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body{
            background-color: rgb(129, 129, 253);
            color: white; /* Comentário em CSS */
            font-family: Arial, Helvetica, sans-serif;
            font: normal 20pt Arial ;
        }

        h1{
            color: rgb(255, 255, 106);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1> <!-- Isso é um comentário. -->
    <p>Já me livrei da maldição.</p>
    <script>
        var n1 = Number(window.prompt('Digite um número: ')) //string
        var n2 = Number.parseFloat(window.prompt('Digite outro número: ')) //string
        var s = n1 + n2
        window.alert('A soma dos valores é ' + s) // Concatenação.
        // (number + number) para adição;
        // (string + string) para concatenação.

        // window.prompt retorna uma string, mesmo que digite um número.
    </script>
</body>
</html>
